<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pyramid Ascent: Lava Rising</title>
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
    <style>
        body { margin: 0; background: #000; color: #d4af37; font-family: 'Segoe UI', sans-serif; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; touch-action: none; }
        canvas { background: #111; border: 2px solid #d4af37; border-radius: 8px; width: 100vw; height: 100vh; max-width: 400px; max-height: 600px; display: block; }
        #overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; text-align: center; }
        .gold-btn { background: #d4af37; color: #000; padding: 18px 45px; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; text-transform: uppercase; font-size: 20px; box-shadow: 0 4px 15px rgba(255,68,0,0.4); }
        #score-ui { position: absolute; top: 15px; width: 350px; display: flex; justify-content: space-between; font-weight: bold; font-size: 18px; pointer-events: none; z-index: 50; text-shadow: 2px 2px #000; }
    </style>
</head>
<body>

    <div id="score-ui">
        <div>ALT: <span id="curH">0</span>m</div>
        <div>BEST: <span id="bestH">0</span>m</div>
    </div>

    <div id="overlay">
        <h1 id="title" style="color: #ff4400; letter-spacing: 2px; margin-bottom: 5px; text-shadow: 0 0 15px #ff0000;">LAVA ASCENT</h1>
        <p id="info-text" style="color: #fff; margin-bottom: 30px;">Escape the heat!</p>
        <button id="action-btn" class="gold-btn" onclick="startGame()">START CLIMB</button>
    </div>

    <audio id="bgMusic" loop preload="auto"><source src="music.mp3" type="audio/mpeg"></audio>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const audio = document.getElementById('bgMusic');
        const info = document.getElementById('info-text');
        const title = document.getElementById('title');
        
        canvas.width = 400; canvas.height = 600;

        let height = 0, highScore = localStorage.getItem('pyramid_lava_v2.8') || 0;
        let gameOver = true, musicStarted = false;
        let player = { x: 200, y: 500, r: 12, vy: 0, vx: 0 };
        let platforms = [], cameraY = 0;
        
        // Lava Settings
        let lavaHeight = 0; 
        let lavaSpeed = 0.35;
        let lavaDelay = 0; // Delay counter
        let waveTime = 0;

        document.getElementById('bestH').innerText = highScore;

        function resetGame() {
            height = 0; cameraY = 0; 
            lavaHeight = 0; 
            lavaDelay = 180; // ~3 seconds at 60fps
            waveTime = 0;
            player = { x: 200, y: 500, r: 12, vy: 0, vx: 0 };
            platforms = [{ x: 0, y: 580, w: 400, h: 30 }];
            for (let i = 1; i < 10; i++) { addPlatform(580 - i * 135); }
            document.getElementById('curH').innerText = "0";
        }

        function addPlatform(y) {
            let w = Math.max(70, 120 - (height / 10));
            platforms.push({ x: Math.random() * (400 - w), y: y, w: w, h: 16 });
        }

        function startGame() {
            resetGame();
            document.getElementById('overlay').style.display = 'none';
            if (!musicStarted) { audio.play().catch(e => {}); musicStarted = true; }
            gameOver = false;
        }

        function move(inputX) {
            const rect = canvas.getBoundingClientRect();
            const scale = 400 / rect.width;
            const mouseX = (inputX - rect.left) * scale;
            player.vx = (mouseX - player.x) * 0.2;
        }

        window.addEventListener('mousemove', (e) => { if(!gameOver) move(e.clientX); });
        window.addEventListener('touchmove', (e) => { 
            if(!gameOver) { move(e.touches.clientX); e.preventDefault(); }
        }, { passive: false });

        function update() {
            if (gameOver) return;

            player.x += player.vx;
            player.vy += 0.42;
            player.y += player.vy;
            if (player.x < 10) player.x = 10; if (player.x > 390) player.x = 390;

            // Lava Delay logic
            if (lavaDelay > 0) {
                lavaDelay--;
            } else {
                lavaHeight += lavaSpeed;
            }
            
            waveTime += 0.05;

            platforms.forEach(p => {
                if (player.vy > 0 && player.y + player.r > p.y && player.y + player.r < p.y + p.h + 12 && player.x > p.x - 5 && player.x < p.x + p.w + 5) {
                    player.y = p.y - player.r;
                    player.vy = -14.5;
                    let currentAlt = Math.floor((580 - p.y) / 10);
                    if (currentAlt > height) {
                        height = currentAlt;
                        document.getElementById('curH').innerText = height;
                        if (height > highScore) {
                            highScore = height;
                            localStorage.setItem('pyramid_lava_v2.8', highScore);
                            document.getElementById('bestH').innerText = highScore;
                        }
                    }
                }
            });

            if (player.y < cameraY + 280) cameraY = player.y - 280;
            if (platforms[platforms.length - 1].y > cameraY - 100) addPlatform(platforms[platforms.length - 1].y - 135);
            
            // Check Collision
            let playerScreenY = player.y - cameraY;
            let currentLavaY = 600 - lavaHeight;
            let waveYAtPlayer = currentLavaY + Math.sin(player.x * 0.04 + waveTime) * 15;

            if (player.y > cameraY + 650 || (lavaHeight > 10 && playerScreenY + player.r > waveYAtPlayer)) {
                gameOver = true;
                title.innerText = lavaHeight > 10 && playerScreenY + player.r > waveYAtPlayer ? "BURNED!" : "ASCENT ENDED";
                info.innerText = "Altitude: " + height + "m";
                document.getElementById('overlay').style.display = 'flex';
            }
        }

        function draw() {
            ctx.fillStyle = "#111";
            ctx.fillRect(0, 0, 400, 600);
            
            ctx.save(); 
            ctx.translate(0, -cameraY);
            ctx.fillStyle = '#d4af37';
            platforms.forEach(p => ctx.fillRect(p.x, p.y, p.w, p.h));
            ctx.fillStyle = '#fff';
            ctx.shadowBlur = 15; ctx.shadowColor = '#fff';
            ctx.beginPath(); ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2); ctx.fill();
            ctx.shadowBlur = 0;
            ctx.restore();

            // Only draw lava if it has height
            if (lavaHeight > 5) {
                let baseY = 600 - lavaHeight;
                ctx.beginPath();
                ctx.moveTo(0, 600);
                for (let x = 0; x <= 400; x += 5) {
                    let y = baseY + Math.sin(x * 0.04 + waveTime) * 15;
                    ctx.lineTo(x, y);
                }
                ctx.lineTo(400, 600);
                ctx.closePath();

                let grad = ctx.createLinearGradient(0, baseY - 20, 0, 600);
                grad.addColorStop(0, '#ffff00'); 
                grad.addColorStop(0.1, '#ff6600'); 
                grad.addColorStop(0.4, '#aa0000'); 
                grad.addColorStop(1, '#330000'); 
                ctx.fillStyle = grad;
                ctx.fill();
            }

            update();
            requestAnimationFrame(draw);
        }
        draw();
    </script>
</body>
</html>
