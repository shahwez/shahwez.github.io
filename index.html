<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pyramid Ascent</title>
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
    <script src="https://minepi.com"></script>
    <style>
        body { margin: 0; background: #000; color: #d4af37; font-family: sans-serif; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; touch-action: none; }
        canvas { background: #111; border: 2px solid #d4af37; border-radius: 8px; width: 100%; max-width: 400px; height: auto; }
        #overlay { position: absolute; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; text-align: center; }
        .btn { background: #d4af37; color: #000; padding: 20px 40px; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; text-transform: uppercase; font-size: 20px; }
        #status { position: absolute; bottom: 20px; font-size: 12px; opacity: 0.5; }
    </style>
</head>
<body>
    <div id="status">Status: Initializing...</div>
    <div id="overlay">
        <h1 style="color:#d4af37; letter-spacing:3px;">PYRAMID ASCENT</h1>
        <p id="msg" style="color:#fff; margin-bottom:30px;">Tap to Start Ascent</p>
        <button class="btn" onclick="forceStart()">START GAME</button>
    </div>

    <audio id="bgMusic" loop preload="auto"><source src="music.mp3" type="audio/mpeg"></audio>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const audio = document.getElementById('bgMusic');
        const status = document.getElementById('status');
        canvas.width = 400; canvas.height = 600;

        let height = 0, gameOver = true, musicStarted = false;
        const player = { x: 200, y: 500, r: 12, vy: 0, vx: 0 };
        let platforms = [], cameraY = 0;

        // --- FIX: Force Game to Run ---
        function forceStart() {
            document.getElementById('overlay').style.display = 'none';
            if (!musicStarted) {
                audio.play().then(() => { musicStarted = true; }).catch(e => status.innerText = "Audio Blocked");
            }
            gameOver = false;
            initLevel();
        }

        function initLevel() {
            platforms = []; cameraY = 0; player.x = 200; player.y = 500; player.vy = 0;
            platforms.push({ x: 0, y: 580, w: 400, h: 20 });
            for (let i = 1; i < 10; i++) platforms.push({ x: Math.random() * 300, y: 580 - i * 130, w: 100, h: 15 });
        }

        // Horizontal control (Mobile Touch)
        window.addEventListener('touchmove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const touchX = e.touches[0].clientX - rect.left;
            player.vx = (touchX - (player.x * (rect.width/400))) * 0.1;
        });

        // Horizontal control (Mouse)
        window.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            player.vx = (mouseX - (player.x * (rect.width/400))) * 0.1;
        });

        function update() {
            if (gameOver) return;
            player.x += player.vx; player.vy += 0.5; player.y += player.vy;
            if (player.x < 0) player.x = 400; if (player.x > 400) player.x = 0;

            platforms.forEach(p => {
                if (player.vy > 0 && player.y + player.r > p.y && player.y + player.r < p.y + p.h + 10 && player.x > p.x && player.x < p.x + p.w) {
                    player.y = p.y - player.r; player.vy = -14;
                    let h = Math.floor((580 - p.y) / 10);
                    if (h > height) height = h;
                }
            });

            if (player.y < cameraY + 250) cameraY = player.y - 250;
            if (platforms[platforms.length - 1].y > cameraY - 100) {
                platforms.push({ x: Math.random() * 300, y: platforms[platforms.length - 1].y - 130, w: 100, h: 15 });
            }
            if (player.y > cameraY + 650) {
                gameOver = true;
                document.getElementById('overlay').style.display = 'flex';
                document.getElementById('msg').innerText = "SCORE: " + height + "m";
            }
        }

        function draw() {
            ctx.clearRect(0, 0, 400, 600);
            ctx.save(); ctx.translate(0, -cameraY);
            ctx.fillStyle = '#d4af37'; 
            platforms.forEach(p => ctx.fillRect(p.x, p.y, p.w, p.h));
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
            update(); requestAnimationFrame(draw);
        }

        // Initialize Pi in background
        try {
            Pi.init({ version: "1.5", sandbox: true });
            Pi.authenticate(['username'], (p) => {}).then(auth => {
                status.innerText = "Welcome, " + auth.user.username;
            });
        } catch(e) { status.innerText = "Pi Network Offline"; }

        draw();
    </script>
</body>
</html>
