<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ascend Pi-Ramid</title>
    <!-- Pi SDK -->
    <script src="https://minepi.com"></script>
    <!-- Firebase SDKs -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
    <style>
        body { margin: 0; background: #0a0500; color: #d4af37; font-family: 'Segoe UI', sans-serif; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; touch-action: none; }
        canvas { background: radial-gradient(circle at top, #1a120b 0%, #000 100%); border: 3px solid #d4af37; border-radius: 12px; width: 95vw; max-width: 400px; box-shadow: 0 0 30px rgba(212,175,55,0.2); }
        #ui { position: absolute; top: 20px; width: 360px; display: flex; justify-content: space-between; font-size: 18px; pointer-events: none; z-index: 10; font-weight: bold; text-shadow: 2px 2px #000; }
        #overlay { position: absolute; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; text-align: center; }
        .gold-btn { background: #d4af37; color: #000; padding: 15px 40px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; text-transform: uppercase; margin: 10px; font-size: 18px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        #user-tag { position: absolute; bottom: 15px; font-size: 12px; opacity: 0.6; }
    </style>
</head>
<body>

    <div id="ui">
        <div>ALTITUDE: <span id="heightText">0</span>m</div>
        <div>BEST: <span id="highScoreText">0</span>m</div>
    </div>

    <div id="user-tag">Guest Mode</div>

    <div id="overlay">
        <h1 style="color: #d4af37; letter-spacing: 4px; margin-bottom: 5px;">ASCEND PI-RAMID</h1>
        <p id="status-text" style="color: #fff; margin-bottom: 25px; opacity: 0.8;">The Desert Awaits...</p>
        <button class="gold-btn" onclick="startGame()">START ASCENT</button>
        <button id="pi-btn" class="gold-btn" style="background:#444; color:#fff; font-size: 14px;" onclick="initPi()">SYNC PI ACCOUNT</button>
    </div>

    <audio id="bgMusic" loop preload="auto"><source src="music.mp3" type="audio/mpeg"></audio>
    <canvas id="gameCanvas"></canvas>

    <script>
        // --- CONFIGURATION ---
        const APP_NAME = "Ascend Pi-Ramid";
        
        const firebaseConfig = {
            apiKey: "AIzaSyDeaQF-003Hu6EAK4S0hEQyBs77en-YTIU",
            authDomain: "://firebaseapp.com",
            projectId: "pi-ramid-ascent",
            storageBucket: "pi-ramid-ascent.firebasestorage.app",
            appId: "1:889789419959:web:7ff463fca36c02032e9832"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const audio = document.getElementById('bgMusic');
        canvas.width = 400; canvas.height = 600;

        let height = 0, highScore = localStorage.getItem('ascend_piramid_top_v7') || 0, gameOver = true;
        const player = { x: 200, y: 500, r: 13, vy: 0, vx: 0 };
        let platforms = [], cameraY = 0, musicStarted = false;
        let currentUser = null;

        document.getElementById('highScoreText').innerText = highScore;

        // --- CORE GAME ACTIONS ---
        function startGame() {
            document.getElementById('overlay').style.display = 'none';
            if (!musicStarted) { audio.play().catch(e => {}); musicStarted = true; }
            gameOver = false;
            resetLevel();
        }

        function resetLevel() {
            platforms = []; cameraY = 0; player.x = 200; player.y = 500; player.vy = 0; player.vx = 0;
            platforms.push({ x: 0, y: 580, w: 400, h: 25 });
            for (let i = 1; i < 10; i++) spawnPlatform(580 - i * 135);
        }

        function spawnPlatform(yPos) {
            let w = Math.max(60, 120 - (height / 10)); 
            platforms.push({ x: Math.random() * (400 - w), y: yPos, w: w, h: 18 });
        }

        // Mouse & Touch Controls
        function move(clientX) {
            const rect = canvas.getBoundingClientRect();
            const mouseX = (clientX - rect.left) * (400 / rect.width);
            player.vx = (mouseX - player.x) * 0.22;
        }
        window.addEventListener('mousemove', (e) => move(e.clientX));
        window.addEventListener('touchmove', (e) => move(e.touches[0].clientX));

        function update() {
            if (gameOver) return;
            player.x += player.vx; player.vy += 0.45; player.y += player.vy;
            if (player.x < 0) player.x = 400; if (player.x > 400) player.x = 0;

            platforms.forEach(p => {
                if (player.vy > 0 && player.y + player.r > p.y && player.y + player.r < p.y + p.h + 10 && player.x > p.x - 10 && player.x < p.x + p.w + 10) {
                    player.y = p.y - player.r; player.vy = -15; // JUMP!
                    let h = Math.floor((580 - p.y) / 10);
                    if (h > height) {
                        height = h;
                        document.getElementById('heightText').innerText = height;
                        if (height > highScore) { 
                            highScore = height; 
                            localStorage.setItem('ascend_piramid_top_v7', highScore); 
                            document.getElementById('highScoreText').innerText = highScore;
                        }
                    }
                }
            });

            if (player.y < cameraY + 280) cameraY = player.y - 280;
            if (platforms[platforms.length - 1].y > cameraY - 100) spawnPlatform(platforms[platforms.length - 1].y - 135);
            if (player.y > cameraY + 680) { 
                gameOver = true; audio.pause();
                document.getElementById('overlay').style.display = 'flex'; 
                document.getElementById('status-text').innerText = "CLIMB ENDED: " + height + "m"; 
            }
        }

        function draw() {
            ctx.clearRect(0, 0, 400, 600);
            ctx.save(); ctx.translate(0, -cameraY);
            platforms.forEach(p => { 
                ctx.fillStyle = '#d4af37'; ctx.fillRect(p.x, p.y, p.w, p.h); 
                ctx.fillStyle = 'rgba(255,255,255,0.1)'; ctx.fillRect(p.x, p.y, p.w, 4);
            });
            ctx.fillStyle = '#fff'; ctx.shadowBlur = 15; ctx.shadowColor = '#fff';
            ctx.beginPath(); ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
            update(); requestAnimationFrame(draw);
        }

        // --- PI NETWORK SYNC ---
        async function initPi() {
            try {
                const Pi = window.Pi;
                Pi.init({ version: "1.5", sandbox: true });
                const auth = await Pi.authenticate(['username'], (p) => {});
                currentUser = auth.user;
                document.getElementById('status-text').innerText = "Logged in as " + currentUser.username;
                document.getElementById('user-tag').innerText = "Pioneer: " + currentUser.username;
                document.getElementById('pi-btn').style.display = "none";
            } catch (err) {
                alert("Pi Sync Failed. Ensure you are in the Pi Browser.");
            }
        }

        draw();
    </script>
</body>
</html>
