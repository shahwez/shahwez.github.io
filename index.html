<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pyramid Ascent</title>
    <!-- Forced fresh SDK load -->
    <script src="https://minepi.com"></script>
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
    <style>
        body { margin: 0; background: #000; color: #d4af37; font-family: sans-serif; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; touch-action: none; }
        canvas { background: #111; border: 2px solid #d4af37; border-radius: 8px; width: 100vw; height: 100vh; max-width: 400px; max-height: 600px; display: block; }
        #overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; text-align: center; }
        .gold-btn { background: #d4af37; color: #000; padding: 18px 45px; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; text-transform: uppercase; font-size: 20px; box-shadow: 0 4px 15px rgba(212,175,55,0.4); margin: 10px; }
        #pi-status { position: absolute; bottom: 20px; font-size: 11px; color: #ffcc00; font-weight: bold; text-align: center; width: 100%; opacity: 0.8; }
    </style>
</head>
<body>

    <div id="overlay">
        <h1 style="color: #ff4400; letter-spacing: 2px;">LAVA ASCENT</h1>
        <p id="info-text" style="color: #fff; margin-bottom: 30px;">Tap to Enter the Tomb</p>
        <button id="main-btn" class="gold-btn" onclick="handleStartButtonClick()">START ASCENT</button>
    </div>

    <div id="pi-status">STATUS: STANDBY</div>

    <audio id="bgMusic" loop preload="auto"><source src="music.mp3" type="audio/mpeg"></audio>
    <canvas id="gameCanvas"></canvas>

    <script>
        // --- MASTER GAME ENGINE (LOCKED V3.2) ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const audio = document.getElementById('bgMusic');
        const info = document.getElementById('info-text');
        const status = document.getElementById('pi-status');
        
        canvas.width = 400; canvas.height = 600;
        let height = 0, gameOver = true, musicStarted = false;
        let player = { x: 200, y: 300, r: 12, vy: 0, vx: 0 };
        let platforms = [], cameraY = 0, lavaHeight = 0, lavaSpeed = 0.25, lavaActive = false, waveTime = 0, freezeTimer = 0;
        let currentUser = null;

        function resetLevel() {
            height = 0; cameraY = 0; lavaHeight = 0; lavaActive = false; waveTime = 0; freezeTimer = 0;
            player = { x: 200, y: 300, r: 12, vy: 0, vx: 0 };
            platforms = [{ x: 100, y: 380, w: 200, h: 30, gem: false }];
            for (let i = 1; i < 10; i++) platforms.push({ x: Math.random() * 280, y: 380 - i * 140, w: 100, h: 18, gem: Math.random() < 0.15 });
        }

        async function handleStartButtonClick() {
            if (currentUser) {
                runActualGameStart();
            } else {
                status.innerText = "PI NETWORK: SYNCING...";
                await attemptPiLogin();
            }
        }

        async function attemptPiLogin() {
            try {
                // If opening in Sandbox on PC, we must use sandbox: true
                // If opening in Pi Browser on Phone, we use sandbox: false
                const isSandbox = window.location.href.includes('://minepi.com');
                
                await window.Pi.init({ version: "1.5", sandbox: isSandbox });
                const auth = await window.Pi.authenticate(['username'], (p) => {});
                
                currentUser = auth.user;
                status.innerText = "CONNECTED: " + currentUser.username;
                info.innerText = "Pioneer Identity Confirmed!";
                setTimeout(runActualGameStart, 500);
            } catch (err) {
                // One final try with the opposite sandbox setting
                try {
                    await window.Pi.init({ version: "1.5", sandbox: !window.location.href.includes('://minepi.com') });
                    const auth = await window.Pi.authenticate(['username'], (p) => {});
                    currentUser = auth.user;
                    status.innerText = "CONNECTED: " + currentUser.username;
                    runActualGameStart();
                } catch(e) {
                    status.innerText = "AUTH ERROR: REFRESH PI BROWSER";
                    alert("Pi Link Failed. Try typing your URL WITHOUT the final slash '/' in the Pi Browser.");
                }
            }
        }

        function runActualGameStart() {
            resetLevel();
            document.getElementById('overlay').style.display = 'none';
            if (!musicStarted) { audio.play().catch(()=>{}); musicStarted = true; }
            gameOver = false;
            setTimeout(() => { lavaActive = true; }, 3000);
        }

        window.addEventListener('touchmove', (e) => { 
            if(!gameOver) {
                const rect = canvas.getBoundingClientRect();
                player.vx = ((e.touches[0].clientX - rect.left) * (400 / rect.width) - player.x) * 0.15;
                e.preventDefault();
            }
        }, { passive: false });

        function update() {
            if (gameOver) return;
            player.x += player.vx; player.vy += 0.35; player.y += player.vy;
            if (player.x < 10) player.x = 10; if (player.x > 390) player.x = 390;
            if (freezeTimer > 0) freezeTimer--; else if (lavaActive) lavaHeight += lavaSpeed;
            waveTime += (freezeTimer > 0 ? 0.01 : 0.05);

            platforms.forEach(p => {
                if (player.vy > 0 && player.y + player.r > p.y && player.y + player.r < p.y + p.h + 15 && player.x > p.x - 10 && player.x < p.x + p.w + 10) {
                    player.y = p.y - player.r; player.vy = -12;
                    if (p.gem) { p.gem = false; freezeTimer = 300; }
                    let currentAlt = Math.floor((380 - p.y) / 10);
                    if (currentAlt > height) height = currentAlt;
                }
            });
            if (player.y < cameraY + 250) cameraY += (player.y - 250 - cameraY) * 0.1;
            if (platforms[platforms.length - 1].y > cameraY - 100) platforms.push({ x: Math.random() * 280, y: platforms[platforms.length - 1].y - 140, w: Math.max(80, 130 - (height / 10)), h: 18, gem: Math.random() < 0.15 });
            
            let playerScreenY = player.y - cameraY;
            let waveY = (600 - lavaHeight) + Math.sin(player.x * 0.04 + waveTime) * 12;
            if (player.y > cameraY + 680 || (lavaActive && lavaHeight > 5 && playerScreenY + player.r > waveY)) {
                gameOver = true;
                document.getElementById('overlay').style.display = 'flex';
                info.innerText = "SCORE: " + height + "m";
            }
        }

        function draw() {
            ctx.fillStyle = "#111"; ctx.fillRect(0, 0, 400, 600);
            ctx.save(); ctx.translate(0, -cameraY);
            platforms.forEach(p => {
                ctx.fillStyle = '#d4af37'; ctx.fillRect(p.x, p.y, p.w, p.h);
                if (p.gem) { ctx.fillStyle = '#00f2ff'; ctx.beginPath(); ctx.moveTo(p.x + p.w/2, p.y - 15); ctx.lineTo(p.x + p.w/2 + 8, p.y - 7); ctx.lineTo(p.x + p.w/2, p.y + 1); ctx.lineTo(p.x + p.w/2 - 8, p.y - 7); ctx.fill(); }
            });
            ctx.fillStyle = '#fff'; ctx.shadowBlur = 15; ctx.shadowColor = (freezeTimer > 0 ? '#00f2ff' : '#fff');
            ctx.beginPath(); ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
            if (lavaHeight > 1) {
                let baseY = 600 - lavaHeight;
                ctx.beginPath(); ctx.moveTo(0, 600);
                for (let x = 0; x <= 400; x += 5) ctx.lineTo(x, baseY + Math.sin(x * 0.04 + waveTime) * 15);
                ctx.lineTo(400, 600); ctx.closePath();
                ctx.fillStyle = freezeTimer > 0 ? '#004466' : '#ff4400'; ctx.fill();
            }
            update(); requestAnimationFrame(draw);
        }

        draw();
    </script>
</body>
</html>
