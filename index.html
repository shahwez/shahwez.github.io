<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ascend Pi-Ramid</title>
    <!-- Use the most stable Pi SDK Link -->
    <script src="https://minepi.com"></script>
    <style>
        body { margin: 0; background: #000; color: #d4af37; font-family: sans-serif; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; touch-action: none; }
        canvas { background: #111; border: 2px solid #d4af37; border-radius: 8px; width: 100vw; max-width: 400px; height: 100vh; max-height: 600px; display: block; }
        #ui { position: absolute; top: 10px; width: 90%; max-width: 380px; display: flex; justify-content: space-between; font-size: 18px; pointer-events: none; z-index: 10; font-weight: bold; }
        #overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; text-align: center; }
        .gold-btn { background: #d4af37; color: #000; padding: 15px 40px; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; text-transform: uppercase; font-size: 18px; margin: 10px; }
        #status-msg { position: absolute; bottom: 20px; font-size: 11px; color: #d4af37; width: 80%; text-align: center; }
    </style>
</head>
<body>

    <div id="ui">
        <div>ALT: <span id="heightText">0</span>m</div>
        <div>BEST: <span id="highScoreText">0</span>m</div>
    </div>

    <div id="overlay">
        <h1 style="color: #d4af37; letter-spacing: 2px;">ASCEND PI-RAMID</h1>
        <p id="info-text" style="color: #fff; margin-bottom: 20px;">Synchronizing with Pi...</p>
        <button class="gold-btn" onclick="startGame()">START ASCENT</button>
        <button id="pi-btn" class="gold-btn" style="background:#444; color:#fff; font-size: 14px; display:none;" onclick="initPi()">RETRY CONNECTION</button>
    </div>

    <div id="status-msg">Waiting for Pi Browser Handshake...</div>

    <audio id="bgMusic" loop preload="auto"><source src="music.mp3" type="audio/mpeg"></audio>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const audio = document.getElementById('bgMusic');
        canvas.width = 400; canvas.height = 600;

        let height = 0, highScore = localStorage.getItem('ascend_pi_v10') || 0;
        let gameOver = true;
        const player = { x: 200, y: 500, r: 12, vy: 0, vx: 0 };
        let platforms = [], cameraY = 0;

        document.getElementById('highScoreText').innerText = highScore;

        function initLevel() {
            platforms = []; cameraY = 0; height = 0;
            player.x = 200; player.y = 500; player.vy = 0; player.vx = 0;
            platforms.push({ x: 0, y: 580, w: 400, h: 20 });
            for (let i = 1; i < 10; i++) platforms.push({ x: Math.random() * 300, y: 580 - i * 135, w: 100, h: 15 });
        }

        function startGame() {
            document.getElementById('overlay').style.display = 'none';
            audio.play().catch(() => {});
            initLevel();
            gameOver = false;
        }

        function handleInput(inputX) {
            const rect = canvas.getBoundingClientRect();
            const scale = 400 / rect.width;
            const mouseX = (inputX - rect.left) * scale;
            const targetVx = (mouseX - player.x) * 0.18;
            player.vx = Math.max(-10, Math.min(10, targetVx)); 
        }

        window.addEventListener('mousemove', (e) => { if(!gameOver) handleInput(e.clientX); });
        window.addEventListener('touchmove', (e) => { 
            if(!gameOver) {
                handleInput(e.touches[0].clientX);
                e.preventDefault();
            }
        }, { passive: false });

        function update() {
            if (gameOver) return;
            player.x += player.vx; player.vy += 0.45; player.y += player.vy;
            if (player.x < 10) player.x = 10; if (player.x > 390) player.x = 390;

            platforms.forEach(p => {
                if (player.vy > 0 && player.y + player.r > p.y && player.y + player.r < p.y + p.h + 12 && player.x > p.x - 5 && player.x < p.x + p.w + 5) {
                    player.y = p.y - player.r; player.vy = -14.5;
                    let h = Math.floor((580 - p.y) / 10);
                    if (h > height) {
                        height = h;
                        document.getElementById('heightText').innerText = height;
                    }
                }
            });

            if (player.y < cameraY + 250) cameraY = player.y - 250;
            if (platforms[platforms.length - 1].y > cameraY - 100) {
                platforms.push({ x: Math.random() * 300, y: platforms[platforms.length - 1].y - 135, w: Math.max(60, 110 - (height/8)), h: 15 });
            }

            if (player.y > cameraY + 650) {
                gameOver = true;
                if (height > highScore) {
                    highScore = height;
                    localStorage.setItem('ascend_pi_v10', highScore);
                    document.getElementById('highScoreText').innerText = highScore;
                }
                document.getElementById('overlay').style.display = 'flex';
                document.getElementById('info-text').innerText = "SCORE: " + height + "m";
            }
        }

        function draw() {
            ctx.clearRect(0, 0, 400, 600);
            ctx.save(); ctx.translate(0, -cameraY);
            ctx.fillStyle = '#d4af37';
            platforms.forEach(p => ctx.fillRect(p.x, p.y, p.w, p.h));
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
            update();
            requestAnimationFrame(draw);
        }

        // --- THE NUCLEAR PI FIX ---
        async function initPi() {
            const status = document.getElementById('status-msg');
            const info = document.getElementById('info-text');
            status.innerText = "Connecting to Pi Network...";

            try {
                // FORCE Sandbox to false if you are in the real Pi Browser
                // Many users report this fixes the connection loop
                await window.Pi.init({ version: "1.5", sandbox: false });
                
                const auth = await window.Pi.authenticate(['username', 'payments'], (p) => {});
                
                info.innerText = "Welcome Pioneer, " + auth.user.username;
                status.innerText = "Connected as: " + auth.user.username;
                document.getElementById('pi-btn').style.display = "none";
            } catch (err) {
                console.error(err);
                status.innerText = "Handshake failed. Retrying in Sandbox mode...";
                // Fallback attempt
                try {
                    await window.Pi.init({ version: "1.5", sandbox: true });
                    const auth = await window.Pi.authenticate(['username'], (p) => {});
                    info.innerText = "Connected (Sandbox): " + auth.user.username;
                    status.innerText = "Sandbox Auth Active";
                } catch (e2) {
                    status.innerText = "Pi Offline. Using Local Play.";
                    info.innerText = "Ready to Climb?";
                    document.getElementById('pi-btn').style.display = "block";
                }
            }
        }

        // Start checking 1.5 seconds after page loads to give Browser time to inject SDK
        setTimeout(initPi, 1500);
        draw();
    </script>
</body>
</html>
