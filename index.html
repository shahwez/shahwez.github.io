<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ascend Pi-Ramid</title>
    <!-- We load the SDK with a cache-buster to force the latest version -->
    <script src="https://minepi.com"></script>
    <style>
        body { margin: 0; background: #000; color: #d4af37; font-family: sans-serif; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; touch-action: none; }
        canvas { background: #111; border: 2px solid #d4af37; border-radius: 8px; width: 100vw; max-width: 400px; height: 100vh; max-height: 600px; display: block; }
        #ui { position: absolute; top: 10px; width: 90%; max-width: 380px; display: flex; justify-content: space-between; font-size: 18px; pointer-events: none; z-index: 10; font-weight: bold; }
        #overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; text-align: center; }
        .gold-btn { background: #d4af37; color: #000; padding: 15px 40px; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; text-transform: uppercase; font-size: 18px; margin: 10px; }
        #debug-log { position: absolute; bottom: 10px; font-size: 9px; color: #444; width: 90%; text-align: center; }
    </style>
</head>
<body>

    <div id="ui">
        <div>ALT: <span id="heightText">0</span>m</div>
        <div>BEST: <span id="highScoreText">0</span>m</div>
    </div>

    <div id="overlay">
        <h1 style="color: #d4af37; letter-spacing: 2px;">ASCEND PI-RAMID</h1>
        <p id="info-text" style="color: #fff; margin-bottom: 20px;">Establishing Secure Link...</p>
        <button id="start-btn" class="gold-btn" onclick="startGame()">START ASCENT</button>
        <button id="pi-btn" class="gold-btn" style="background:#555; color:#fff; font-size: 14px; display:none;" onclick="manualConnect()">RETRY PI LINK</button>
    </div>

    <div id="debug-log">V1.1 - Handshake Pending</div>

    <audio id="bgMusic" loop preload="auto"><source src="music.mp3" type="audio/mpeg"></audio>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const audio = document.getElementById('bgMusic');
        const log = document.getElementById('debug-log');
        const info = document.getElementById('info-text');
        
        canvas.width = 400; canvas.height = 600;

        let height = 0, highScore = localStorage.getItem('ascend_pi_v11') || 0;
        let gameOver = true;
        const player = { x: 200, y: 500, r: 12, vy: 0, vx: 0 };
        let platforms = [], cameraY = 0;

        document.getElementById('highScoreText').innerText = highScore;

        function initLevel() {
            platforms = []; cameraY = 0; height = 0;
            player.x = 200; player.y = 500; player.vy = 0; player.vx = 0;
            platforms.push({ x: 0, y: 580, w: 400, h: 20 });
            for (let i = 1; i < 10; i++) platforms.push({ x: Math.random() * 300, y: 580 - i * 135, w: 100, h: 15 });
        }

        function startGame() {
            document.getElementById('overlay').style.display = 'none';
            audio.play().catch(() => {});
            initLevel();
            gameOver = false;
        }

        function handleInput(inputX) {
            const rect = canvas.getBoundingClientRect();
            const scale = 400 / rect.width;
            player.vx = ((inputX - rect.left) * scale - player.x) * 0.18;
        }

        window.addEventListener('mousemove', (e) => { if(!gameOver) handleInput(e.clientX); });
        window.addEventListener('touchmove', (e) => { if(!gameOver) { handleInput(e.touches[0].clientX); e.preventDefault(); } }, { passive: false });

        function update() {
            if (gameOver) return;
            player.x += player.vx; player.vy += 0.45; player.y += player.vy;
            if (player.x < 10) player.x = 10; if (player.x > 390) player.x = 390;

            platforms.forEach(p => {
                if (player.vy > 0 && player.y + player.r > p.y && player.y + player.r < p.y + p.h + 12 && player.x > p.x - 5 && player.x < p.x + p.w + 5) {
                    player.y = p.y - player.r; player.vy = -14.5;
                    let h = Math.floor((580 - p.y) / 10);
                    if (h > height) { height = h; document.getElementById('heightText').innerText = height; }
                }
            });

            if (player.y < cameraY + 250) cameraY = player.y - 250;
            if (platforms[platforms.length - 1].y > cameraY - 100) {
                platforms.push({ x: Math.random() * 300, y: platforms[platforms.length - 1].y - 135, w: Math.max(60, 110 - (height/8)), h: 15 });
            }

            if (player.y > cameraY + 650) {
                gameOver = true;
                if (height > highScore) { highScore = height; localStorage.setItem('ascend_pi_v11', highScore); document.getElementById('highScoreText').innerText = highScore; }
                document.getElementById('overlay').style.display = 'flex';
                info.innerText = "SCORE: " + height + "m";
            }
        }

        function draw() {
            ctx.clearRect(0, 0, 400, 600);
            ctx.save(); ctx.translate(0, -cameraY);
            ctx.fillStyle = '#d4af37';
            platforms.forEach(p => ctx.fillRect(p.x, p.y, p.w, p.h));
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
            update();
            requestAnimationFrame(draw);
        }

        // --- PI AUTO-HANDSHAKE ---
        async function connectPi(isManual = false) {
            log.innerText = "Pi Init Started...";
            try {
                // IMPORTANT: sandbox: true is safer for GitHub Pages testing
                await window.Pi.init({ version: "1.5", sandbox: true });
                log.innerText = "Pi.init Success. Authenticating...";
                
                const auth = await window.Pi.authenticate(['username', 'payments'], (p) => {
                    log.innerText = "Incomplete payment detected.";
                });
                
                info.innerText = "Welcome " + auth.user.username + "!";
                log.innerText = "Linked: " + auth.user.username;
                document.getElementById('pi-btn').style.display = "none";
            } catch (err) {
                log.innerText = "Link Blocked: " + err.message;
                if (isManual) alert("Error: Use Pi Browser and match portal URL exactly.");
                info.innerText = "Pi Offline - Local Play Enabled";
                document.getElementById('pi-btn').style.display = "block";
            }
        }

        function manualConnect() { connectPi(true); }

        // Give the browser 2 seconds to load GitHub fully before trying Pi
        setTimeout(() => connectPi(false), 2000);
        draw();
    </script>
</body>
</html>
