<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pyramid Ascent: Balanced</title>
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
    <style>
        body { margin: 0; background: #000; color: #d4af37; font-family: 'Segoe UI', sans-serif; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; touch-action: none; }
        canvas { background: #111; border: 2px solid #d4af37; border-radius: 8px; width: 100vw; height: 100vh; max-width: 400px; max-height: 600px; display: block; }
        #overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; text-align: center; }
        .gold-btn { background: #d4af37; color: #000; padding: 18px 45px; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; text-transform: uppercase; font-size: 20px; box-shadow: 0 4px 15px rgba(255,68,0,0.4); }
        #score-ui { position: absolute; top: 15px; width: 350px; display: flex; justify-content: space-between; font-weight: bold; font-size: 18px; pointer-events: none; z-index: 50; text-shadow: 2px 2px #000; }
    </style>
</head>
<body>

    <div id="score-ui">
        <div>ALTITUDE: <span id="curH">0</span>m</div>
        <div>RECORD: <span id="bestH">0</span>m</div>
    </div>

    <div id="overlay">
        <h1 id="title" style="color: #ff4400; letter-spacing: 2px; margin-bottom: 5px; text-shadow: 0 0 15px #ff0000;">PYRAMID CLIMB</h1>
        <p id="info-text" style="color: #fff; margin-bottom: 30px;">Take your time. Don't slip.</p>
        <button id="action-btn" class="gold-btn" onclick="startGame()">START CLIMB</button>
    </div>

    <audio id="bgMusic" loop preload="auto"><source src="music.mp3" type="audio/mpeg"></audio>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const audio = document.getElementById('bgMusic');
        const info = document.getElementById('info-text');
        const title = document.getElementById('title');
        
        canvas.width = 400; canvas.height = 600;

        let height = 0, highScore = localStorage.getItem('pyramid_balanced_v2.3') || 0;
        let gameOver = true, musicStarted = false;
        let player = { x: 200, y: 500, r: 12, vy: 0, vx: 0 };
        let platforms = [], cameraY = 0;
        
        // SLOWER Lava Logic
        let lavaWorldY = 650; 
        let lavaBaseSpeed = 0.25; // Much slower starting speed

        document.getElementById('bestH').innerText = highScore;

        function resetGame() {
            height = 0; cameraY = 0; 
            lavaWorldY = 680; // Starts further down
            player = { x: 200, y: 500, r: 12, vy: 0, vx: 0 };
            platforms = [{ x: 0, y: 580, w: 400, h: 25 }];
            for (let i = 1; i < 10; i++) { addPlatform(580 - i * 135); }
            document.getElementById('curH').innerText = "0";
        }

        function addPlatform(y) {
            // Wider platforms for longer
            let w = Math.max(70, 125 - (height / 12));
            platforms.push({ x: Math.random() * (400 - w), y: y, w: w, h: 16 });
        }

        function startGame() {
            resetGame();
            document.getElementById('overlay').style.display = 'none';
            if (!musicStarted) { audio.play().catch(e => {}); musicStarted = true; }
            gameOver = false;
        }

        function move(inputX) {
            const rect = canvas.getBoundingClientRect();
            const scale = 400 / rect.width;
            const mouseX = (inputX - rect.left) * scale;
            player.vx = (mouseX - player.x) * 0.15; // Smoother tracking
        }

        window.addEventListener('mousemove', (e) => { if(!gameOver) move(e.clientX); });
        window.addEventListener('touchmove', (e) => { 
            if(!gameOver) { move(e.touches[0].clientX); e.preventDefault(); }
        }, { passive: false });

        function update() {
            if (gameOver) return;

            player.x += player.vx;
            player.vy += 0.4; // Slightly lower gravity for "floatier" jumps
            player.y += player.vy;
            
            if (player.x < 10) player.x = 10; if (player.x > 390) player.x = 390;

            // Slower Lava Rise
            let currentLavaSpeed = lavaBaseSpeed + (height * 0.001); 
            lavaWorldY -= currentLavaSpeed;

            platforms.forEach(p => {
                if (player.vy > 0 && player.y + player.r > p.y && player.y + player.r < p.y + p.h + 12 && player.x > p.x - 5 && player.x < p.x + p.w + 5) {
                    player.y = p.y - player.r;
                    player.vy = -14; // Standard jump height
                    
                    let currentAlt = Math.floor((580 - p.y) / 10);
                    if (currentAlt > height) {
                        height = currentAlt;
                        document.getElementById('curH').innerText = height;
                        if (height > highScore) {
                            highScore = height;
                            localStorage.setItem('pyramid_balanced_v2.3', highScore);
                            document.getElementById('bestH').innerText = highScore;
                        }
                    }
                }
            });

            // Smoother camera following
            let targetCamY = player.y - 300;
            if (targetCamY < cameraY) cameraY += (targetCamY - cameraY) * 0.1;

            if (platforms[platforms.length - 1].y > cameraY - 100) addPlatform(platforms[platforms.length - 1].y - 140);
            
            // Death conditions
            if (player.y > cameraY + 700 || player.y + player.r > lavaWorldY) {
                gameOver = true;
                title.innerText = player.y + player.r > lavaWorldY ? "TOO HOT!" : "FALLEN";
                info.innerText = "Altitude: " + height + "m";
                document.getElementById('overlay').style.display = 'flex';
            }
        }

        function draw() {
            ctx.clearRect(0, 0, 400, 600);
            
            ctx.save(); 
            ctx.translate(0, -cameraY);

            // Platforms
            ctx.fillStyle = '#d4af37';
            platforms.forEach(p => ctx.fillRect(p.x, p.y, p.w, p.h));

            // Player
            ctx.fillStyle = '#fff';
            ctx.shadowBlur = 15; ctx.shadowColor = '#fff';
            ctx.beginPath(); ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2); ctx.fill();
            ctx.shadowBlur = 0;

            // Lava
            let lavaGradient = ctx.createLinearGradient(0, lavaWorldY, 0, lavaWorldY + 600);
            lavaGradient.addColorStop(0, '#ff4400');
            lavaGradient.addColorStop(0.2, '#ff1100');
            lavaGradient.addColorStop(1, '#330000');
            ctx.fillStyle = lavaGradient;
            ctx.fillRect(0, lavaWorldY, 400, 1000);

            // Lava Surface
            ctx.strokeStyle = '#ffff00';
            ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(0, lavaWorldY); ctx.lineTo(400, lavaWorldY); ctx.stroke();

            ctx.restore();

            update();
            requestAnimationFrame(draw);
        }
        draw();
    </script>
</body>
</html>
