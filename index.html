<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pi Sudoku</title>
    <link rel="stylesheet" href="style.css">
    <!-- Pi Network SDK -->
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body>
    <div class="container">
        <h1>Pi Sudoku</h1>
        <div id="user-info"></div>
        <div id="grid"></div>
        <div class="controls">
            <button onclick="checkSolution()">Check Result</button>
            <button onclick="resetGame()">New Game</button>
        </div>
        <div class="numpad">
            <button onclick="inputValue(1)">1</button>
            <button onclick="inputValue(2)">2</button>
            <button onclick="inputValue(3)">3</button>
            <button onclick="inputValue(4)">4</button>
            <button onclick="inputValue(5)">5</button>
            <button onclick="inputValue(6)">6</button>
            <button onclick="inputValue(7)">7</button>
            <button onclick="inputValue(8)">8</button>
            <button onclick="inputValue(9)">9</button>
        </div>
        <div id="monetize-section">
            <p>Stuck? Get a hint for 0.1 Pi!</p>
            <button onclick="buyHint()">Buy Hint</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
