<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ascend Pi-Ramid</title>
    <!-- Pi SDK -->
    <script src="https://minepi.com"></script>
    <style>
        body { margin: 0; background: #000; color: #d4af37; font-family: sans-serif; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; touch-action: none; }
        canvas { background: #111; border: 2px solid #d4af37; width: 100vw; height: 100vh; max-width: 400px; max-height: 600px; display: block; }
        #ui { position: absolute; top: 10px; width: 90%; max-width: 380px; display: flex; justify-content: space-between; font-size: 18px; pointer-events: none; z-index: 10; font-weight: bold; }
        #overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; text-align: center; }
        .gold-btn { background: #d4af37; color: #000; padding: 15px 40px; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; text-transform: uppercase; font-size: 18px; margin: 10px; }
        #status-msg { position: absolute; bottom: 20px; font-size: 12px; color: #666; }
    </style>
</head>
<body>

    <div id="ui">
        <div>ALT: <span id="heightText">0</span>m</div>
        <div>BEST: <span id="highScoreText">0</span>m</div>
    </div>

    <div id="overlay">
        <h1 style="color: #d4af37; letter-spacing: 2px;">ASCEND PI-RAMID</h1>
        <p id="info-text" style="color: #fff; margin-bottom: 20px;">Ready for the Sands?</p>
        <button class="gold-btn" onclick="startGame()">START ASCENT</button>
        <button id="pi-btn" class="gold-btn" style="background:#444; color:#fff; font-size: 14px;" onclick="initPi()">CONNECT PI</button>
    </div>

    <div id="status-msg">Engine Ready</div>

    <!-- Background Music -->
    <audio id="bgMusic" loop preload="auto"><source src="music.mp3" type="audio/mpeg"></audio>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const audio = document.getElementById('bgMusic');
        const statusMsg = document.getElementById('status-msg');
        
        canvas.width = 400;
        canvas.height = 600;

        let height = 0, highScore = localStorage.getItem('ascend_pi_v8') || 0;
        let gameOver = true, musicActive = false;
        const player = { x: 200, y: 500, r: 12, vy: 0, vx: 0 };
        let platforms = [], cameraY = 0;

        document.getElementById('highScoreText').innerText = highScore;

        // --- 1. THE GAME ENGINE (Ensured to draw even if Pi fails) ---
        function initLevel() {
            platforms = []; 
            cameraY = 0; 
            player.x = 200; 
            player.y = 500; 
            player.vy = 0; 
            player.vx = 0;
            // Floor
            platforms.push({ x: 0, y: 580, w: 400, h: 20 });
            // Starting Platforms
            for (let i = 1; i < 10; i++) {
                platforms.push({ x: Math.random() * 300, y: 580 - i * 130, w: 100, h: 15 });
            }
        }

        function startGame() {
            document.getElementById('overlay').style.display = 'none';
            // Force music to start
            audio.play().then(() => { musicActive = true; }).catch(e => { statusMsg.innerText = "Music blocked - tap screen"; });
            gameOver = false;
            initLevel();
        }

        // Horizontal Control
        function moveInput(clientX) {
            const rect = canvas.getBoundingClientRect();
            const mouseX = (clientX - rect.left) * (400 / rect.width);
            player.vx = (mouseX - player.x) * 0.2;
        }
        window.addEventListener('mousemove', (e) => moveInput(e.clientX));
        window.addEventListener('touchmove', (e) => moveInput(e.touches.clientX));

        function update() {
            if (gameOver) return;

            player.x += player.vx;
            player.vy += 0.45; // Gravity
            player.y += player.vy;

            // Screen Wrap
            if (player.x < 0) player.x = 400;
            if (player.x > 400) player.x = 0;

            // Platform Collision
            platforms.forEach(p => {
                if (player.vy > 0 && 
                    player.y + player.r > p.y && 
                    player.y + player.r < p.y + p.h + 10 && 
                    player.x > p.x - 5 && player.x < p.x + p.w + 5) {
                    player.y = p.y - player.r;
                    player.vy = -14.5; // Bounce!
                    
                    let h = Math.floor((580 - p.y) / 10);
                    if (h > height) {
                        height = h;
                        document.getElementById('heightText').innerText = height;
                        if (height > highScore) {
                            highScore = height;
                            localStorage.setItem('ascend_pi_v8', highScore);
                            document.getElementById('highScoreText').innerText = highScore;
                        }
                    }
                }
            });

            // Camera follow
            if (player.y < cameraY + 250) cameraY = player.y - 250;
            
            // Endless generation
            if (platforms[platforms.length - 1].y > cameraY - 100) {
                platforms.push({ x: Math.random() * 320, y: platforms[platforms.length - 1].y - 135, w: Math.max(65, 100 - (height/10)), h: 15 });
            }

            // Death
            if (player.y > cameraY + 650) {
                gameOver = true;
                document.getElementById('overlay').style.display = 'flex';
                document.getElementById('info-text').innerText = "CLIMB ENDED: " + height + "m";
            }
        }

        function draw() {
            ctx.clearRect(0, 0, 400, 600);
            ctx.save();
            ctx.translate(0, -cameraY);

            // Draw Platforms
            ctx.fillStyle = '#d4af37';
            platforms.forEach(p => ctx.fillRect(p.x, p.y, p.w, p.h));

            // Draw Ball (Player)
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
            update();
            requestAnimationFrame(draw);
        }

        // --- 2. PI NETWORK INTEGRATION ---
        async function initPi() {
            statusMsg.innerText = "Connecting to Pi...";
            try {
                // Initialize the SDK - MUST be in Pi Browser
                await window.Pi.init({ version: "1.5", sandbox: true });
                const auth = await window.Pi.authenticate(['username'], (p) => {});
                document.getElementById('info-text').innerText = "Welcome " + auth.user.username;
                document.getElementById('pi-btn').style.display = "none";
                statusMsg.innerText = "Pi Connected: " + auth.user.username;
            } catch (err) {
                alert("Connect Failed. Please ensure your URL in develop.pi matches exactly.");
                statusMsg.innerText = "Pi Browser Error";
            }
        }

        // Start drawing immediately
        draw();
    </script>
</body>
</html>
