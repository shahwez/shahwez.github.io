<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ascend Pyramid - V1.4</title>
    <!-- Force latest Pi SDK -->
    <script src="https://minepi.com"></script>
    <style>
        body { margin: 0; background: #000; color: #d4af37; font-family: sans-serif; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; touch-action: none; }
        canvas { background: #111; border: 2px solid #d4af37; border-radius: 8px; width: 100vw; max-width: 400px; height: 100vh; max-height: 600px; }
        #overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; text-align: center; }
        .gold-btn { background: #d4af37; color: #000; padding: 15px 40px; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; text-transform: uppercase; font-size: 18px; margin: 10px; }
        #debug-box { position: absolute; bottom: 0; width: 100%; background: rgba(0,0,0,0.7); color: #0f0; font-family: monospace; font-size: 10px; padding: 5px; pointer-events: none; }
    </style>
</head>
<body>

    <div id="overlay">
        <h1 style="color: #d4af37;">ASCEND PYRAMID</h1>
        <p id="info-text" style="color: #fff; margin-bottom: 20px;">Checking Handshake...</p>
        <button class="gold-btn" onclick="startGame()">START GAME</button>
        <button id="pi-btn" class="gold-btn" style="background:#555; color:#fff; display:none;" onclick="initPi()">RECONNECT PI</button>
    </div>

    <div id="debug-box">System: Initializing...</div>

    <audio id="bgMusic" loop><source src="music.mp3" type="audio/mpeg"></audio>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const audio = document.getElementById('bgMusic');
        const debug = document.getElementById('debug-box');
        const info = document.getElementById('info-text');
        
        canvas.width = 400; canvas.height = 600;
        let height = 0, gameOver = true, player = { x: 200, y: 500, r: 12, vy: 0, vx: 0 }, platforms = [], cameraY = 0;

        function log(msg) { debug.innerText = "Log: " + msg; }

        function startGame() {
            document.getElementById('overlay').style.display = 'none';
            audio.play().catch(() => {});
            platforms = [{ x: 0, y: 580, w: 400, h: 20 }];
            for (let i = 1; i < 10; i++) platforms.push({ x: Math.random() * 300, y: 580 - i * 135, w: 100, h: 15 });
            gameOver = false;
        }

        window.addEventListener('touchmove', (e) => {
            const rect = canvas.getBoundingClientRect();
            player.vx = ((e.touches[0].clientX - rect.left) * (400/rect.width) - player.x) * 0.2;
        }, { passive: false });

        function update() {
            if (gameOver) return;
            player.x += player.vx; player.vy += 0.45; player.y += player.vy;
            if (player.x < 10) player.x = 10; if (player.x > 390) player.x = 390;

            platforms.forEach(p => {
                if (player.vy > 0 && player.y + player.r > p.y && player.y + player.r < p.y + p.h + 12 && player.x > p.x - 5 && player.x < p.x + p.w + 5) {
                    player.y = p.y - player.r; player.vy = -14.5;
                    let h = Math.floor((580 - p.y) / 10);
                    if (h > height) height = h;
                }
            });

            if (player.y < cameraY + 250) cameraY = player.y - 250;
            if (platforms[platforms.length - 1].y > cameraY - 100) {
                platforms.push({ x: Math.random() * 300, y: platforms[platforms.length - 1].y - 135, w: 80, h: 15 });
            }
            if (player.y > cameraY + 650) {
                gameOver = true; document.getElementById('overlay').style.display = 'flex';
                info.innerText = "SCORE: " + height + "m";
            }
        }

        function draw() {
            ctx.clearRect(0, 0, 400, 600);
            ctx.save(); ctx.translate(0, -cameraY);
            ctx.fillStyle = '#d4af37';
            platforms.forEach(p => ctx.fillRect(p.x, p.y, p.w, p.h));
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
            update(); requestAnimationFrame(draw);
        }

        // --- PI LOGIC ---
        async function initPi() {
            log("Pi.init starting...");
            try {
                // SANDBOX: set to true for ://minepi.com, false for phone Pi Browser
                const isSandbox = window.location.host.includes("sandbox");
                await window.Pi.init({ version: "1.5", sandbox: isSandbox });
                log("Init Success. Authenticating...");
                
                const auth = await window.Pi.authenticate(['username'], (p) => {});
                log("Auth Success: " + auth.user.username);
                info.innerText = "Welcome " + auth.user.username + "!";
                document.getElementById('pi-btn').style.display = "none";
            } catch (err) {
                log("Error: " + err.message);
                info.innerText = "Pi Connection Deferred";
                document.getElementById('pi-btn').style.display = "block";
            }
        }

        setTimeout(initPi, 2000);
        draw();
    </script>
</body>
</html>
