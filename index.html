<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ascend Pyramid - V1.5</title>
    <!-- Use the most stable Pi SDK Link -->
    <script src="https://minepi.com"></script>
    <!-- Firebase SDKs -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
    <style>
        body { margin: 0; background: #000; color: #d4af37; font-family: sans-serif; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; touch-action: none; }
        canvas { background: #111; border: 2px solid #d4af37; border-radius: 8px; width: 100vw; max-width: 400px; height: 100vh; max-height: 600px; }
        #overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; text-align: center; }
        .gold-btn { background: #d4af37; color: #000; padding: 15px 40px; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; text-transform: uppercase; font-size: 18px; margin: 10px; }
        #debug-log { position: absolute; bottom: 0; width: 100%; background: rgba(0,0,0,0.8); color: #0f0; font-family: monospace; font-size: 10px; padding: 5px; text-align: left; pointer-events: none; }
    </style>
</head>
<body>

    <div id="overlay">
        <h1 style="color: #d4af37; letter-spacing: 2px;">PYRAMID ASCENT</h1>
        <p id="info-text" style="color: #fff; margin-bottom: 20px;">Initializing Ancient Systems...</p>
        <button class="gold-btn" onclick="startGame()">START GAME</button>
        <button id="pi-btn" class="gold-btn" style="background:#555; color:#fff; display:none;" onclick="retryPi()">RETRY PI LINK</button>
    </div>

    <div id="debug-log">Log: System Booting...</div>

    <audio id="bgMusic" loop><source src="music.mp3" type="audio/mpeg"></audio>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const audio = document.getElementById('bgMusic');
        const debug = document.getElementById('debug-log');
        const info = document.getElementById('info-text');
        
        canvas.width = 400; canvas.height = 600;
        let height = 0, gameOver = true, player = { x: 200, y: 500, r: 12, vy: 0, vx: 0 }, platforms = [], cameraY = 0;

        function log(msg) { debug.innerText = "Log: " + msg; console.log(msg); }

        // --- FIREBASE CONFIG ---
        const firebaseConfig = {
            apiKey: "AIzaSyDeaQF-003Hu6EAK4S0hEQyBs77en-YTIU",
            authDomain: "://firebaseapp.com",
            projectId: "pi-ramid-ascent",
            storageBucket: "pi-ramid-ascent.firebasestorage.app",
            appId: "1:889789419959:web:7ff463fca36c02032e9832"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // --- GAME LOGIC ---
        function startGame() {
            document.getElementById('overlay').style.display = 'none';
            audio.play().catch(() => {});
            platforms = [{ x: 0, y: 580, w: 400, h: 20 }];
            for (let i = 1; i < 10; i++) platforms.push({ x: Math.random() * 300, y: 580 - i * 135, w: 100, h: 15 });
            gameOver = false;
        }

        window.addEventListener('touchmove', (e) => {
            const rect = canvas.getBoundingClientRect();
            player.vx = ((e.touches[0].clientX - rect.left) * (400/rect.width) - player.x) * 0.2;
        }, { passive: false });

        function update() {
            if (gameOver) return;
            player.x += player.vx; player.vy += 0.45; player.y += player.vy;
            if (player.x < 10) player.x = 10; if (player.x > 390) player.x = 390;

            platforms.forEach(p => {
                if (player.vy > 0 && player.y + player.r > p.y && player.y + player.r < p.y + p.h + 12 && player.x > p.x - 5 && player.x < p.x + p.w + 5) {
                    player.y = p.y - player.r; player.vy = -14.5;
                    let h = Math.floor((580 - p.y) / 10);
                    if (h > height) height = h;
                }
            });

            if (player.y < cameraY + 250) cameraY = player.y - 250;
            if (platforms[platforms.length - 1].y > cameraY - 100) platforms.push({ x: Math.random() * 300, y: platforms[platforms.length - 1].y - 135, w: 80, h: 15 });
            if (player.y > cameraY + 650) {
                gameOver = true; document.getElementById('overlay').style.display = 'flex';
                info.innerText = "FINAL ALTITUDE: " + height + "m";
                saveScore(height);
            }
        }

        async function saveScore(s) {
            if (s < 10) return;
            try { await db.collection("leaderboard").add({ username: "Pioneer", score: s, ts: Date.now() }); } catch(e) {}
        }

        function draw() {
            ctx.clearRect(0, 0, 400, 600);
            ctx.save(); ctx.translate(0, -cameraY);
            ctx.fillStyle = '#d4af37';
            platforms.forEach(p => ctx.fillRect(p.x, p.y, p.w, p.h));
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
            update(); requestAnimationFrame(draw);
        }

        // --- PI NETWORK HANDSHAKE (WAIT FOR SDK) ---
        let checkCount = 0;
        function initPi() {
            checkCount++;
            log("Checking for Pi SDK (Attempt " + checkCount + ")...");
            
            if (window.Pi) {
                log("SDK Found! Initializing...");
                runPiAuth();
            } else if (checkCount < 20) {
                setTimeout(initPi, 500); // Check every 0.5s for 10 seconds
            } else {
                log("SDK Load Timeout. Play Offline.");
                info.innerText = "Pi Link Timed Out";
                document.getElementById('pi-btn').style.display = "block";
            }
        }

        async function runPiAuth() {
            try {
                const isSandbox = window.location.host.includes("sandbox") || window.location.host.includes("github");
                await window.Pi.init({ version: "1.5", sandbox: isSandbox });
                log("Pi.init OK. Authenticating...");
                const auth = await window.Pi.authenticate(['username'], (p) => {});
                log("Auth Success: " + auth.user.username);
                info.innerText = "Welcome " + auth.user.username + "!";
                document.getElementById('pi-btn').style.display = "none";
            } catch (err) {
                log("Auth Error: " + err.message);
                document.getElementById('pi-btn').style.display = "block";
            }
        }

        function retryPi() { checkCount = 0; initPi(); }

        initPi();
        draw();
    </script>
</body>
</html>
